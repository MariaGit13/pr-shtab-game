<style>
:root{--ink:#29251f;--muted:#766f64;--cream:#f7f4ec;--paper:#fffefb;--line:#e4ded3;--lime:#d5ef70;--olive:#64764a;--pink:#ffbdd0;--shadow:0 14px 42px rgba(42,37,31,.07);--radius:22px}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--cream);color:var(--ink);font-family:Inter,Arial,Helvetica,sans-serif;font-size:16px;line-height:1.5}button,input,textarea{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #9caf46;outline-offset:3px}button:disabled{opacity:.45;cursor:not-allowed} .shell{max-width:1120px;margin:0 auto;padding:22px 24px 70px}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:4px 0 22px;border-bottom:1px solid var(--line)}.brand{display:flex;align-items:center;gap:11px;font-size:13px;font-weight:850;letter-spacing:.09em}.brand-icon{display:grid;place-items:center;background:var(--ink);color:var(--lime);width:42px;height:42px;border-radius:13px;font-size:22px}.top-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.timer{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:9px 14px;font-weight:850;font-variant-numeric:tabular-nums}.timer.warning{background:#ffe2df;color:#8b3129}.small-btn{background:transparent;border:1px solid var(--line);border-radius:999px;padding:9px 13px;font-size:12px;font-weight:800;color:var(--ink)}.small-btn:hover{background:white}.hero{padding:40px 0 22px}.eyebrow{font-size:12px;font-weight:900;letter-spacing:.16em;text-transform:uppercase;color:var(--olive);margin-bottom:12px}.hero h1{font-size:clamp(44px,7.6vw,91px);letter-spacing:-.065em;line-height:.96;margin:0 0 20px;font-weight:950}.hero h1 em{font-style:normal;background:var(--lime);padding:0 .13em;border-radius:14px}.hero p{max-width:750px;color:#5c574f;font-size:18px;margin:0}.chips{display:flex;flex-wrap:wrap;gap:8px;margin:24px 0}.chip{border:1px solid var(--line);padding:7px 13px;border-radius:999px;font-size:12px;font-weight:800;background:var(--paper)}.chip.pink{background:var(--pink);border-color:transparent}.chip.lime{background:var(--lime);border-color:transparent}.grid{display:grid;grid-template-columns:1.1fr .9fr;gap:20px}.panel{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:28px;box-shadow:var(--shadow)}.panel.dark{background:var(--ink);color:#f8f4e9;border-color:var(--ink)}.panel.dark p,.panel.dark li{color:#d7d1c5}.panel h2{font-size:25px;letter-spacing:-.04em;line-height:1.12;margin:0 0 16px}.panel h3{margin:0 0 10px;font-size:19px}.panel p{margin:0 0 14px}.muted{color:var(--muted)}.form-label{display:block;font-size:12px;font-weight:850;letter-spacing:.06em;text-transform:uppercase;margin:19px 0 7px}input[type=text],textarea{width:100%;background:#fff;border:1px solid #d7d1c6;border-radius:13px;padding:12px 14px;color:var(--ink)}textarea{min-height:95px;resize:vertical}.help{font-size:12px;color:var(--muted);margin-top:6px}.primary{display:inline-flex;align-items:center;justify-content:center;gap:9px;background:var(--ink);color:white;border:0;border-radius:14px;padding:14px 21px;font-weight:850;min-height:48px}.primary:hover{background:#494239}.primary.lime{background:var(--lime);color:var(--ink)}.primary.lime:hover{background:#c3e253}.secondary{background:white;color:var(--ink);border:1px solid var(--line);border-radius:14px;padding:12px 18px;font-weight:850}.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:20px}.rules{margin:0;padding-left:20px}.rules li{margin:9px 0}.hidden{display:none!important}.stage-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:28px 0 12px}.stage-tag{font-weight:900;font-size:12px;letter-spacing:.12em;color:var(--olive);text-transform:uppercase}.stage-title{font-size:clamp(28px,4.8vw,48px);letter-spacing:-.05em;line-height:1.07;margin:8px 0 10px}.progress{height:9px;background:#e4e0d6;border-radius:100px;overflow:hidden}.progress>div{height:100%;width:0;background:var(--olive);transition:width .3s}.scenario{font-size:19px;line-height:1.58;padding:20px 22px;border-left:5px solid var(--lime);background:#f8f8ef;border-radius:0 16px 16px 0;margin:20px 0}.section-caption{font-size:12px;letter-spacing:.13em;font-weight:900;color:var(--olive);text-transform:uppercase;margin:0 0 10px}.choice-list{display:grid;gap:11px}.choice{display:block;text-align:left;width:100%;border:1.5px solid var(--line);background:white;padding:16px 18px;border-radius:15px;color:var(--ink);transition:background .12s,border-color .12s,transform .12s}.choice:hover{background:#f4f7e9;border-color:#a1ae73;transform:translateY(-1px)}.choice .letter{display:inline-grid;place-items:center;background:#eee9df;border-radius:9px;width:29px;height:29px;font-weight:900;margin-right:9px;font-size:13px}.choice strong{font-size:15px}.choice .desc{display:block;margin:6px 0 0 38px;color:#625d55;font-size:14px}.step-line{display:flex;gap:7px;flex-wrap:wrap;margin:15px 0 25px}.step{border:1px solid var(--line);border-radius:100px;padding:6px 10px;font-size:11px;font-weight:800;color:#777064}.step.active{background:var(--pink);color:var(--ink);border-color:transparent}.step.done{background:var(--lime);color:var(--ink);border-color:transparent}.notice{background:#fff1f5;border:1px solid #f1cfda;border-radius:14px;padding:13px 16px;font-size:14px;margin:12px 0}.vote-cover{background:var(--ink);color:white;border-radius:20px;padding:27px;margin:18px 0}.vote-cover h3{font-size:25px}.vote-cover p{color:#ddd7ca}.vote-cover .primary{background:var(--lime);color:var(--ink)}.ballot-title{font-size:19px;font-weight:900;margin:18px 0 13px}.vote-stats{display:grid;gap:12px;margin:20px 0}.stat-row{display:grid;grid-template-columns:40px 1fr 45px;gap:11px;align-items:center;font-size:14px}.stat-bar{height:15px;border-radius:50px;background:#ede9e1;overflow:hidden}.stat-bar>div{height:100%;background:var(--olive);border-radius:50px}.summary-stat{display:flex;gap:12px;flex-wrap:wrap;margin:12px 0}.stat-pill{background:#f1eee5;padding:8px 12px;border-radius:12px;font-weight:800;font-size:13px}.feedback{background:#f4f8e8;border:1px solid #dce8b9;padding:22px;border-radius:17px;margin-top:18px}.feedback h3{font-size:24px;margin:0 0 10px}.feedback p{margin:8px 0}.feedback strong{color:#344823}.score-big{font-size:58px;font-weight:950;letter-spacing:-.07em;line-height:1}.result-card{padding:18px 20px;border-radius:15px;background:#f7f5ef;border:1px solid var(--line);margin:12px 0}.result-card h3{margin:0 0 6px}.result-card p{margin:5px 0}.score-panel{background:var(--ink);color:white;padding:24px;border-radius:20px}.score-panel .score-big{color:var(--lime)}.pill-number{font-size:12px;font-weight:850;background:var(--pink);border-radius:999px;padding:7px 11px;display:inline-block}.footer{margin-top:35px;font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:18px}.teacher{margin-top:22px;border:1px dashed #a49d90;background:#f2efe7;border-radius:16px;padding:20px}.teacher summary{font-weight:850;cursor:pointer}.teacher p{margin:10px 0}.teacher ul{margin:10px 0;padding-left:22px}.teacher li{margin:5px 0}.kpi{display:flex;gap:8px;flex-wrap:wrap}.kpi span{background:#f4f1e9;border-radius:11px;padding:9px 12px;font-size:13px;font-weight:850}.big-quote{font-size:24px;font-weight:850;letter-spacing:-.03em;line-height:1.3}.compact{font-size:14px}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}@media(max-width:720px){.shell{padding:16px 14px 45px}.grid{grid-template-columns:1fr}.panel{padding:20px}.hero{padding-top:30px}.hero p{font-size:16px}.top-right{justify-content:flex-end}.stage-head{align-items:flex-start;flex-direction:column}.scenario{font-size:17px;padding:16px}.choice{padding:13px}.hero h1{font-size:54px}.top{align-items:flex-start}}@media print{body{background:white}.top,.actions,.teacher,.footer,.no-print,.progress,.step-line,.chips{display:none!important}.shell{max-width:none;padding:0}.panel{box-shadow:none;border:0;padding:0}.result-card{break-inside:avoid}.hero{padding:0}.hero h1{font-size:40px}.print-only{display:block!important}}.print-only{display:none}
</style>

<script>
'use strict';
const MISSIONS=[{"tag":"Раунд 01 / Свои и чужие","title":"Чья идея лучше?","effect":"Эффект «мы и они» и групповой фаворитизм","time":"5 минут","story":"В агентстве две проектные команды: «Лайм» и «Пульс». Ваша команда «Лайм» оценивает два рекламных концепта. Идея «Пульса» получила 82 балла в независимом тестировании, идея «Лайма» — 65. Однако несколько коллег говорят: «Наши точно талантливее, а их концепт просто удачно попал в выборку». Руководство просит выбрать вариант для клиента.","question":"Как команда должна выбрать концепт?","options":[{"t":"Выбрать идею «Лайма»: своим нужно помогать","d":"Принадлежность к своей группе важнее данных."},{"t":"Сравнить обе идеи по единым критериям и результатам тестирования","d":"Не подменять качество идеи групповой принадлежностью."},{"t":"Отклонить оба варианта: конкуренция всегда вредна","d":"Не использовать доступные данные и аргументы."}],"scores":[0,10,3],"interventions":[{"t":"Проводить слепую оценку идей по общим критериям","good":true},{"t":"Давать идеям своей команды дополнительные баллы","good":false},{"t":"Сначала спрашивать, какая команда придумала концепт","good":false}],"explain":"По лекции эффект «мы и они» связан с переживанием принадлежности к своей группе и дистанцированием от другой. Групповой фаворитизм проявляется в предпочтении членов собственной группы. Он может искажать оценку чужих идей.","insight":"Скрывайте авторство на этапе первой оценки, фиксируйте критерии качества до обсуждения и проверяйте аргументы.","reflect":"Какой аргумент был важнее при выборе: качество концепта или то, кто его предложил?"},{"tag":"Раунд 02 / Публика наблюдает","title":"Когда зрители помогают, а когда мешают?","effect":"Социальная фасилитация и ингибиция","time":"5 минут","story":"На презентации перед клиентом опытный дизайнер уверенно демонстрирует привычный макет. Новому аналитику впервые поручили объяснить сложную методику исследования: он сбивается, когда на него смотрят 20 человек. Менеджер говорит: «Публика одинаково мотивирует всех — пусть выступают без подготовки».","question":"Как лучше распределить выступление?","options":[{"t":"Поручить новичку самый сложный фрагмент без репетиции","d":"Присутствие зрителей якобы всегда повышает качество работы."},{"t":"Навсегда убрать новичка из публичных выступлений","d":"Исключить возможность развития навыка."},{"t":"Дать опытному знакомый блок, новичку — подготовленный фрагмент с репетицией","d":"Учесть сложность и освоенность действий."}],"scores":[0,2,10],"interventions":[{"t":"Сначала отработать сложное действие в спокойной обстановке","good":true},{"t":"Сразу увеличить аудиторию, чтобы усилить давление","good":false},{"t":"Оценивать способности только по первому публичному ответу","good":false}],"explain":"В лекции отмечается влияние присутствия других на результат деятельности: социальная фасилитация описана как положительное влияние, ингибиция — как затруднение. Для практического анализа важно учитывать освоенность и сложность задания.","insight":"Хорошо освоенные действия можно демонстрировать публично; новые и сложные — предварительно отрепетировать.","reflect":"Вспомните пример, когда наблюдение других людей помогло или помешало выполнить задачу."},{"tag":"Раунд 03 / Давление большинства","title":"Согласен — но только вслух","effect":"Конформизм: уступчивость и одобрение","time":"5 минут","story":"Команда выбирает рекламный слоган. Четверо участников уверены, что провокационная фраза удачна. Пятый считает её неэтичной, но говорит: «Ладно, я за», потому что боится испортить отношения. Шестой после обсуждения действительно меняет своё мнение и начинает считать слоган удачным.","question":"Как организовать окончательное решение?","options":[{"t":"Считать всех согласными и сразу отправить слоган клиенту","d":"Внешнее согласие воспринимается как внутреннее."},{"t":"Сначала собрать независимые аргументы, затем обсудить риски и повторно проголосовать","d":"Создать пространство для содержательного несогласия."},{"t":"Попросить несогласного публично извиниться перед командой","d":"Наказать за отличие мнения."}],"scores":[0,10,0],"interventions":[{"t":"Зафиксировать индивидуальные оценки до обсуждения","good":true},{"t":"Первым дать слово самому влиятельному участнику","good":false},{"t":"Считать молчание полным одобрением","good":false}],"explain":"В лекции конформизм связывается с присоединением к мнению большинства. Уступчивость — внешнее согласие ради поощрения или избегания наказания; одобрение — внутреннее принятие позиции группы. По описанию первый сотрудник демонстрирует уступчивость, второй — одобрение.","insight":"Независимая предварительная оценка и возможность аргументированно возражать помогают не путать согласие с качеством решения.","reflect":"В кейсе кто демонстрирует уступчивость, а кто — одобрение? Чем они отличаются?"},{"tag":"Раунд 04 / Сдвиг решения","title":"От осторожного плана к опасному эксперименту","effect":"Сдвиг риска при групповом решении","time":"5 минут","story":"До совещания сотрудники оценили риск провокационной кампании в 3–4 балла из 10 и предпочли умеренный вариант. Во время обсуждения звучат реплики «Нам нужен вау-эффект!» и «Конкуренты не осмелятся!». После дискуссии команда готова запускать самый рискованный вариант, хотя новых данных об аудитории не появилось.","question":"Как проверить обоснованность нового решения?","options":[{"t":"Выбрать самый рискованный вариант: энтузиазм группы — достаточное основание","d":"Подменить анализ эмоциональным подъёмом."},{"t":"Запретить все нестандартные идеи","d":"Устранить риск без рассмотрения целей."},{"t":"Сравнить оценки до и после дискуссии и проверить варианты по критериям и данным","d":"Отделить изменение позиции от появления новых аргументов."}],"scores":[0,3,10],"interventions":[{"t":"Фиксировать исходные оценки и обоснования до обсуждения","good":true},{"t":"Считать более смелое решение автоматически лучшим","good":false},{"t":"Не обсуждать возможные последствия для аудитории","good":false}],"explain":"В лекции описан феномен «сдвига риска» (Д. Стоунер): после групповой дискуссии решение может сместиться к более крайнему варианту, а не быть средним из исходных предложений. Сам по себе сдвиг не означает, что решение обязательно неверно.","insight":"Сравнивайте исходные и итоговые позиции, фиксируйте новые доказательства и обсуждайте последствия.","reflect":"Какие новые факты действительно появились в ходе дискуссии? Почему решение стало смелее?"},{"tag":"Раунд 05 / Общая работа","title":"Шесть человек и один несданный проект","effect":"Эффект Рингельмана (социальная леность)","time":"5 минут","story":"Шесть сотрудников готовят медиаплан. Задача звучит так: «Все вместе сделайте хорошую презентацию». Каждый считает, что коллеги уже выполняют большую часть работы. В итоге два человека сделали почти всё, а вклад остальных неясен. В следующем месяце команда планирует привлечь ещё четырёх участников.","question":"Как снизить риск повторения ситуации?","options":[{"t":"Добавить ещё участников без распределения задач","d":"Численность сама по себе якобы гарантирует результат."},{"t":"Разделить проект на измеримые задачи, закрепить роли и контрольные точки","d":"Сделать индивидуальный вклад заметным и сохранить общую цель."},{"t":"Поручить всю работу самому активному сотруднику","d":"Снять ответственность с остальных."}],"scores":[0,10,0],"interventions":[{"t":"Фиксировать ответственного и результат по каждой задаче","good":true},{"t":"Не показывать вклад отдельных участников","good":false},{"t":"Оценивать команду только по числу сотрудников","good":false}],"explain":"В лекции эффект Рингельмана описывается как снижение среднего индивидуального вклада в общую работу при увеличении численности группы. В кейсе проблема усиливается размытостью ролей и ответственности.","insight":"Разделение задач, понятные роли и видимый вклад помогают организовать совместную деятельность.","reflect":"Что изменится в работе, если каждый будет знать свой конкретный результат и срок?"},{"tag":"Раунд 06 / Единодушие любой ценой","title":"У нас идеальная кампания. Или нет?","effect":"Группомыслие","time":"5 минут","story":"За день до запуска PR-кампании команда единодушно хвалит креатив. Руководитель говорит: «Мы наконец стали настоящим коллективом, никаких возражений!». Аналитик заметил, что шутка может оскорбить часть аудитории, но не хочет разрушать атмосферу. Альтернативные концепции даже не рассматривают.","question":"Как команде поступить перед запуском?","options":[{"t":"Запустить кампанию: единодушие означает отсутствие рисков","d":"Согласие заменяет проверку альтернатив."},{"t":"Назначить участника для критической оценки и проверить возможные реакции аудитории","d":"Обсудить альтернативы и риски, сохраняя уважение к команде."},{"t":"Исключить аналитика из обсуждения","d":"Устранить несогласного вместо проблемы."}],"scores":[0,10,0],"interventions":[{"t":"Предусмотреть роль критика и отдельное обсуждение альтернатив","good":true},{"t":"Попросить всех поддержать лидера без вопросов","good":false},{"t":"Оценивать только преимущества исходного плана","good":false}],"explain":"В лекции эффект группомыслия описан как стремление к согласию с общей точкой зрения, которое начинает преобладать над реалистической оценкой альтернативных действий.","insight":"Сильной команде нужны не только общие цели, но и процедуры проверки идей, право на несогласие и рассмотрение альтернатив.","reflect":"Почему отсутствие споров ещё не доказывает качество решения?"}];
const MAX_SCORE=MISSIONS.length*15;
const app=document.getElementById('app'); const timerEl=document.getElementById('timer'); const pauseBtn=document.getElementById('pauseBtn');
let state={team:'',members:[],mission:0,phase:'start',votes:[],voter:0,ballotOpen:false,groupChoice:null,intervention:null,results:[],reflection:'',seconds:2400,running:false,finished:false};
let ticker=null;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clean=s=>String(s??'').trim().slice(0,120);
function persist(){try{localStorage.setItem('pr-shtab-lecture-v1',JSON.stringify({...state,running:false,ballotOpen:false}));}catch(e){}}
function load(){try{const s=JSON.parse(localStorage.getItem('pr-shtab-lecture-v1'));if(s&&Array.isArray(s.members)&&Number.isInteger(s.mission)&&s.mission>=0&&s.mission<=MISSIONS.length&&Array.isArray(s.results)){state={...state,...s,running:false,ballotOpen:false};}}catch(e){}}
function setTimer(){const m=Math.floor(state.seconds/60),s=state.seconds%60;timerEl.textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');timerEl.classList.toggle('warning',state.seconds<=300);pauseBtn.textContent=state.running?'Пауза':'Продолжить';pauseBtn.disabled=state.phase==='start'||state.finished;}
function startTimer(){if(ticker)clearInterval(ticker);state.running=true;ticker=setInterval(()=>{if(!state.running)return;if(state.seconds>0){state.seconds--;setTimer();if(state.seconds%15===0)persist();}else{state.running=false;clearInterval(ticker);setTimer();}},1000);setTimer();}
function pauseTimer(){state.running=!state.running;if(state.running)startTimer();else{clearInterval(ticker);setTimer();}persist();}
function header(){const m=MISSIONS[state.mission];return `<div class="stage-head"><span class="stage-tag">${esc(m.tag)}</span><div class="kpi"><span>Команда: ${esc(state.team)}</span><span>Этап ${state.mission+1} из ${MISSIONS.length}</span></div></div><div class="progress" role="progressbar" aria-valuenow="${state.mission}" aria-valuemin="0" aria-valuemax="${MISSIONS.length}" aria-label="Прогресс игры"><div style="width:${state.mission/MISSIONS.length*100}%"></div></div><h1 class="stage-title">${esc(m.title)}</h1><p class="muted">${esc(m.story)}</p><div class="step-line">${['Личный выбор','Обсуждение','Защита от эффекта','Разбор'].map((x,i)=>`<span class="step ${i===['vote','group','intervene','reveal'].indexOf(state.phase)?'active':i<['vote','group','intervene','reveal'].indexOf(state.phase)?'done':''}">${i+1}. ${x}</span>`).join('')}</div>`}
function optionButtons(arr,kind){return `<div class="choice-list">${arr.map((o,i)=>`<button type="button" class="choice" data-action="${kind}" data-index="${i}"><span class="letter">${String.fromCharCode(65+i)}</span><strong>${esc(o.t)}</strong>${o.d?`<span class="desc">${esc(o.d)}</span>`:''}</button>`).join('')}</div>`}
function renderStart(){app.innerHTML=`<section class="hero"><div class="eyebrow">40 минут · Командная игра · 6 психологических эффектов</div><h1>PR-ШТАБ:<br><em>ЭФФЕКТ</em> ГРУППЫ</h1><p>Шесть ситуаций из жизни рекламного агентства. Разберитесь, как возникают «мы и они», фасилитация, конформизм, сдвиг риска, социальная леность и группомыслие.</p><div class="chips"><span class="chip lime">3–6 участников</span><span class="chip pink">1 экран на команду</span><span class="chip">Работает без интернета</span><span class="chip">Отчёт в конце</span></div></section><div class="grid"><section class="panel"><h2>Создайте PR-команду</h2><label class="form-label" for="teamName">Название команды</label><input type="text" id="teamName" maxlength="60" placeholder="Например, Команда инсайта" value="${esc(state.team)}"><label class="form-label" for="members">Участники (по одному на строке)</label><textarea id="members" rows="5" placeholder="Алина&#10;Даниил&#10;Михаил&#10;Полина">${esc(state.members.join('\n'))}</textarea><div class="help">От 3 до 6 человек. Каждый проголосует отдельно, затем команда обсудит общий ответ.</div><div class="actions"><button class="primary" data-action="start">Начать игру <span aria-hidden="true">↗</span></button></div><p class="help" id="startError" role="alert"></p></section><section class="panel dark"><div class="eyebrow" style="color:var(--lime)">Правила штаба</div><h2>Сначала «я».<br>Потом «мы».</h2><ol class="rules"><li>Прочитайте ситуацию.</li><li>Передавайте устройство по очереди: каждый выбирает ответ без подсказок.</li><li>Посмотрите, как разделились мнения, и обсудите решение.</li><li>Выберите способ снизить риск групповой ошибки.</li><li>Узнайте эффект и запишите один вывод.</li></ol><p style="margin-top:20px;font-size:13px">Важно: это учебные ситуации. Совпадение ответов не доказывает наличие конформизма или другого эффекта.</p></section></div><details class="teacher"><summary>Для преподавателя: сценарий занятия на 40 минут</summary><p><strong>0–4 мин.</strong> Формирование команд, роли: модератор, хранитель времени, скептик, докладчик (в малой команде роли можно объединять).</p><p><strong>4–34 мин.</strong> Шесть ситуаций по ~5 минут: 45 сек — личные ответы, 2 мин — обсуждение, 1 мин — выбор профилактики, 1 мин — обратная связь и запись вывода.</p><p><strong>34–40 мин.</strong> Каждая команда называет наиболее опасный для PR-работы эффект, объясняет способ профилактики, определяет одну полезную групповую норму и сохраняет отчёт для Moodle.</p><p><strong>Оценивание:</strong> до 90 игровых баллов — ориентир для обратной связи, а не психологический тест. При оценке работы учитывайте аргументацию, участие и рефлексию.</p></details>`}
function renderVote(){const m=MISSIONS[state.mission];let content='';if(state.voter>=state.members.length){state.phase='group';render();return;}if(!state.ballotOpen){content=`<div class="vote-cover"><div class="eyebrow" style="color:var(--lime)">Личное решение ${state.voter+1} / ${state.members.length}</div><h3>Очередь: ${esc(state.members[state.voter])}</h3><p>Передайте устройство этому участнику. Остальные не подсказывают. Предыдущие ответы скрыты.</p><button class="primary" data-action="openBallot">Открыть варианты для ${esc(state.members[state.voter])}</button></div>`}else{content=`<div class="panel"><div class="section-caption">Только ваш выбор · ${esc(state.members[state.voter])}</div><div class="ballot-title">${esc(m.question)}</div>${optionButtons(m.options,'vote')}</div>`}app.innerHTML=header()+content+`<p class="help no-print">Голосование не анонимное внутри устройства, но до общего обсуждения варианты ответов других участников не показываются.</p>`}
function voteStats(){const m=MISSIONS[state.mission];return `<div class="vote-stats">${m.options.map((o,i)=>{const count=state.votes.filter(x=>x===i).length;return `<div class="stat-row"><strong>${String.fromCharCode(65+i)}</strong><div class="stat-bar" title="${count} из ${state.members.length}"><div style="width:${count/state.members.length*100}%"></div></div><strong>${count}/${state.members.length}</strong></div><p class="compact" style="margin:-6px 0 2px 50px">${esc(o.t)}</p>`}).join('')}</div>`}
function renderGroup(){const m=MISSIONS[state.mission];app.innerHTML=header()+`<div class="grid"><section class="panel"><div class="section-caption">Как распределились индивидуальные мнения</div>${voteStats()}<div class="notice">Обсудите аргументы каждого. Не выбирайте вариант автоматически только потому, что он набрал больше голосов.</div></section><section class="panel"><div class="section-caption">Командное решение</div><h2>${esc(m.question)}</h2>${optionButtons(m.options,'group')}</section></div>`}
function renderIntervene(){const m=MISSIONS[state.mission];app.innerHTML=header()+`<div class="panel"><div class="section-caption">Ваше общее решение</div><p class="big-quote">${esc(m.options[state.groupChoice].t)}</p><div class="notice">Теперь выберите не «правильный термин», а практический приём, который поможет команде принимать более обоснованные решения в подобных ситуациях.</div><h2>Как защитить команду от ошибки?</h2>${optionButtons(m.interventions,'intervene')}</div>`}
function renderReveal(){const m=MISSIONS[state.mission];const score=m.scores[state.groupChoice]+(m.interventions[state.intervention].good?5:0);const changed=state.votes.filter(v=>v===state.groupChoice).length;app.innerHTML=header()+`<div class="grid"><section class="panel"><span class="pill-number">Групповой эффект № ${state.mission+1}</span><h2 style="font-size:31px;margin-top:15px">${esc(m.effect)}</h2><p>${esc(m.explain)}</p><div class="feedback"><h3>Что помогает?</h3><p>${esc(m.insight)}</p></div></section><section class="panel"><div class="section-caption">Результат решения</div><div class="score-big">+${score}<span style="font-size:20px;letter-spacing:0"> / 15</span></div><p class="muted">Учебные баллы за решение и способ профилактики.</p><p><strong>Ваш выбор:</strong> ${esc(m.options[state.groupChoice].t)}</p><p><strong>Приём:</strong> ${esc(m.interventions[state.intervention].t)}</p><p class="muted compact">${changed} из ${state.members.length} участников изначально выбрали вариант, который стал командным решением. Это не показатель психологического эффекта.</p></section></div><section class="panel" style="margin-top:20px"><label class="form-label" for="reflection">Рефлексия команды (1–2 предложения)</label><p>${esc(m.reflect)}</p><textarea id="reflection" rows="3" placeholder="Наш вывод: ...">${esc(state.reflection)}</textarea><div class="actions"><button class="primary" data-action="next">${state.mission===MISSIONS.length-1?'Перейти к итогам':'Следующий кейс'} <span aria-hidden="true">→</span></button></div></section>`}
function renderFinish(){const total=state.results.reduce((s,r)=>s+r.score,0);const effects=MISSIONS.map((m,i)=>({m,r:state.results[i]}));app.innerHTML=`<section class="hero"><div class="eyebrow">Игра завершена · Отчёт команды</div><h1>КОМАНДА<br><em>ДУМАЕТ</em> ЛУЧШЕ</h1><p>Если умеет различать групповые эффекты, оценивать альтернативы и организовывать совместную работу.</p></section><div class="grid"><section class="score-panel"><div class="section-caption" style="color:var(--lime)">Итоговый результат</div><div class="score-big">${total}<span style="font-size:22px;color:white;letter-spacing:0"> / ${MAX_SCORE}</span></div><p style="color:#d5cfc3;margin-top:14px">${esc(state.team)} · ${state.members.length} участников · 6 ситуаций</p><p style="color:#d5cfc3;font-size:14px">Баллы оценивают выбранные решения в учебной симуляции, а не психологические качества участников.</p></section><section class="panel"><h2>Вопросы для общего обсуждения</h2><ol class="rules"><li>Когда группа помогла принять более обоснованное решение?</li><li>Когда хотелось согласиться с большинством?</li><li>Какой эффект наиболее опасен для работы PR-команды?</li><li>На каком этапе развития малой группы (по Л. И. Уманскому) ваша команда сейчас и почему?</li><li>Какой лидер был бы полезнее в сложной ситуации: ориентированный на задачу или на поддержание отношений? Обоснуйте.</li><li>Какие групповые нормы и роли помогут вашей команде работать эффективнее?</li></ol></section></div><h2 style="font-size:30px;letter-spacing:-.04em;margin:28px 0 14px">История ваших решений</h2>${effects.map(({m,r},i)=>`<article class="result-card"><div class="section-caption">${String(i+1).padStart(2,'0')} · ${esc(m.effect)} · +${r.score}/15</div><h3>${esc(m.title)}</h3><p><strong>Решение:</strong> ${esc(m.options[r.groupChoice].t)}</p><p><strong>Защита:</strong> ${esc(m.interventions[r.intervention].t)}</p><p><strong>Индивидуальные голоса:</strong> ${m.options.map((_,j)=>String.fromCharCode(65+j)+' — '+r.votes.filter(v=>v===j).length).join('; ')}</p><p><strong>Вывод:</strong> ${esc(r.reflection||'Не записан')}</p></article>`).join('')}<div class="actions no-print"><button class="primary" data-action="download">Скачать отчёт .txt ↓</button><button class="secondary" data-action="print">Печать / сохранить PDF</button><button class="secondary" data-action="reset">Сыграть заново</button></div><details class="teacher no-print"><summary>Для преподавателя: как провести рефлексию</summary><p>Попросите команды сравнить не баллы, а аргументы и изменения мнений. Не делайте вывод о наличии конформизма или группового мышления только по голосам: игра не является экспериментальной диагностикой.</p><p>Попросите каждого назвать один практический способ улучшить работу малой группы: независимое голосование, критик идей, распределение ролей, заранее заданные критерии, владелец задачи, безопасная репетиция.</p></details>`}
function render(){setTimer();if(state.phase==='start')renderStart();else if(state.finished||state.phase==='finish')renderFinish();else if(state.phase==='vote')renderVote();else if(state.phase==='group')renderGroup();else if(state.phase==='intervene')renderIntervene();else if(state.phase==='reveal')renderReveal();persist();}
function next(){const m=MISSIONS[state.mission];const reflection=clean(document.getElementById('reflection')?.value||'');const score=m.scores[state.groupChoice]+(m.interventions[state.intervention].good?5:0);state.results.push({votes:[...state.votes],groupChoice:state.groupChoice,intervention:state.intervention,score,reflection});state.mission++;state.votes=[];state.voter=0;state.ballotOpen=false;state.groupChoice=null;state.intervention=null;state.reflection='';if(state.mission>=MISSIONS.length){state.finished=true;state.phase='finish';state.running=false;clearInterval(ticker);}else state.phase='vote';render();window.scrollTo({top:0,behavior:'smooth'});}
function download(){const total=state.results.reduce((s,r)=>s+r.score,0);const lines=[`PR-ШТАБ: ЭФФЕКТ ГРУППЫ`,`Команда: ${state.team}`,`Участники: ${state.members.join(', ')}`,`Результат: ${total}/${MAX_SCORE}`,'',...state.results.flatMap((r,i)=>{const m=MISSIONS[i];return [`${i+1}. ${m.effect} — ${r.score}/15`,`Индивидуальные ответы: ${m.options.map((_,j)=>String.fromCharCode(65+j)+': '+r.votes.filter(v=>v===j).length).join('; ')}`,`Командное решение: ${m.options[r.groupChoice].t}`,`Профилактика: ${m.interventions[r.intervention].t}`,`Вывод: ${r.reflection||'не записан'}`,''];}),`Примечание: баллы — учебный ориентир, а не диагностика групповых эффектов.`];const blob=new Blob(['\ufeff'+lines.join('\n')],{type:'text/plain;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='PR_shtab_'+state.team.replace(/[^а-яА-ЯёЁa-zA-Z0-9_-]+/g,'_').slice(0,35)+'.txt';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);}
app.addEventListener('click',e=>{const btn=e.target.closest('button[data-action]');if(!btn)return;const act=btn.dataset.action;const index=Number(btn.dataset.index);if(act==='start'){const team=clean(document.getElementById('teamName').value);const names=document.getElementById('members').value.split(/[\n,;]+/).map(clean).filter(Boolean);const error=document.getElementById('startError');if(!team){error.textContent='Введите название команды.';return;}if(names.length<3||names.length>6){error.textContent='Укажите от 3 до 6 участников, по одному на строке.';return;}if(new Set(names.map(x=>x.toLowerCase())).size!==names.length){error.textContent='Имена участников должны различаться.';return;}state={...state,team,members:names,mission:0,phase:'vote',votes:[],voter:0,ballotOpen:false,groupChoice:null,intervention:null,results:[],reflection:'',seconds:2400,running:true,finished:false};startTimer();render();}else if(act==='openBallot'){state.ballotOpen=true;render();}else if(act==='vote'){if(!Number.isInteger(index)||index<0||index>=3)return;state.votes.push(index);state.voter++;state.ballotOpen=false;if(state.voter>=state.members.length)state.phase='group';render();}else if(act==='group'){if(!Number.isInteger(index)||index<0||index>=3)return;state.groupChoice=index;state.phase='intervene';render();}else if(act==='intervene'){if(!Number.isInteger(index)||index<0||index>=3)return;state.intervention=index;state.phase='reveal';render();}else if(act==='next'){next();}else if(act==='download'){download();}else if(act==='print'){window.print();}else if(act==='reset'){reset();}});
function reset(){if(state.phase!=='start'&&!confirm('Начать игру заново? Текущие ответы будут удалены.'))return;clearInterval(ticker);state={team:'',members:[],mission:0,phase:'start',votes:[],voter:0,ballotOpen:false,groupChoice:null,intervention:null,results:[],reflection:'',seconds:2400,running:false,finished:false};try{localStorage.removeItem('pr-shtab-lecture-v1')}catch(e){}render();window.scrollTo(0,0)}
document.getElementById('resetBtn').addEventListener('click',reset);pauseBtn.addEventListener('click',pauseTimer);app.addEventListener('input',e=>{if(e.target.id==='reflection'){state.reflection=e.target.value;persist();}});
load();render();
</script>
</body>
</html>
